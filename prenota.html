:root[data-theme="dark"]{--accent-soft:#22392C;--bg:#141714;--card:#1D211E;--ink:#E9ECE8;--mut:#9BA49E;--line:#2D332F;--crit:#F08F7E;--crit-soft:#3B211C;--warn:#E3A04F;--warn-soft:#3A2C18;--ok:#7CC39E;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;max-width:640px;margin:0 auto}
h1{font-size:20px;margin:0;line-height:1.2;text-wrap:balance}
.sub{color:var(--mut);font-size:13.5px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.lang button{border:0;background:var(--card);padding:5px 10px;font-size:13px;font-weight:600}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
main{padding-block:6px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:640px;margin:0 auto}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 8px;font-weight:600}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 0;width:58px;display:grid;justify-items:center;gap:1px}
.day small{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.day b{font-family:var(--f-num);font-size:20px;line-height:1.1}
.day[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.day[aria-pressed=true] small{color:#fff;opacity:.85}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.slot{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 0;font-variant-numeric:tabular-nums;font-weight:600}
.slot[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.fascia{font-size:12.5px;color:var(--mut);margin:10px 0 6px}

.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper b{font-family:var(--f-num);font-size:22px;min-width:28px;text-align:center}
.stepper span{color:var(--mut);font-size:14px;padding-right:6px}
.fields{display:grid;gap:10px}
.fields label{display:grid;gap:4px;font-size:14px;font-weight:600}
.fields input[type=text],.fields input[type=tel],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card);font-weight:400;font-size:16px}
textarea{min-height:64px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:400!important;color:var(--ink)}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.err{color:var(--crit);font-size:13.5px;font-weight:600}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;margin-top:16px}
.stato{display:flex;gap:12px;align-items:center}
.ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none;background:var(--accent-soft);color:var(--ok);font-weight:700}
.ico.warn{background:var(--warn-soft);color:var(--warn)}
.ico.no{background:var(--crit-soft);color:var(--crit)}
.stato h3{margin:0;font-size:19px;line-height:1.25;text-wrap:balance}
.stato p{margin:2px 0 0;color:var(--mut);font-size:14px}
.det{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;border-top:1px solid var(--line);padding-top:12px}
.det dt{color:var(--mut)}
.det dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.quando{font-family:var(--f-num);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.ask{background:var(--warn-soft);border-radius:14px;padding:14px;display:grid;gap:10px}
.ask b{color:var(--warn)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:13px;color:var(--mut)}
.conf{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--bg)}
.chiuso{text-align:center;padding:60px 20px;color:var(--mut)}
.mie{display:grid;gap:6px;margin-top:8px}
.mie a{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);text-decoration:none;font-size:14.5px}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:20;max-width:90vw;text-align:center}
.demo{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mut)}
.demo button{margin-top:6px}
@media (prefers-reduced-motion:no-preference){.card{animation:su .25s ease-out}@keyframes su{from{transform:translateY(6px)}to{transform:none}}}
</style>
</head>

    const campi={nome:x.nome.slice(0,50),tel:x.tel.slice(0,20),data:x.data,ora:x.ora,persone:x.persone,note:String(x.note||"").slice(0,160),acc:!!x.acc,stato:"nuova",conf:"attesa"};
    const scrivi=c=>fbChiedi(`${FSB}:commit`,{writes:[{update:{name:fbNome(id),fields:Object.fromEntries(Object.entries(c).map(([k,v])=>[k,fbEnc(v)]))},updateTransforms:[{fieldPath:"agg",setToServerValue:"REQUEST_TIME"},{fieldPath:"creata",setToServerValue:"REQUEST_TIME"}],currentDocument:{exists:false}}]});
    try{try{await scrivi(Object.assign({priv:x.privacy===true,sal:x.salute===true},campi))}catch(e){if(e.codice!=="negato")throw e;await scrivi(campi)}}
    catch(e){if(e.codice==="negato")e.codice="orario";throw e}
    return{id,k:"",pren:vistaFb(id,campi)}},
  async push(sub){await fbChiedi(`${FSB}:commit`,{writes:[{update:{name:fbNome(PID),fields:{push:fbEnc(JSON.stringify(sub))}},updateMask:{fieldPaths:["push"]},updateTransforms:[{fieldPath:"agg",setToServerValue:"REQUEST_TIME"}]}]})},
  async risposta(r){if(MODO==="api")return chiedi("/api/prenota/risposta",{id:PID,k:PK,r,demo:simula||undefined});
    if(r==="conferma"&&(P.stato!=="attesa"||adesso()<P.finestra)){const e=new Error("presto");e.codice="presto";throw e}
    try{await fbChiedi(`${FSB}:commit`,{writes:[{update:{name:fbNome(PID),fields:{conf:fbEnc(r==="conferma"?"confermata":"disdetta")}},updateMask:{fieldPaths:["conf"]},updateTransforms:[{fieldPath:"agg",setToServerValue:"REQUEST_TIME"}]}]})}
    catch(e){if(e.codice==="negato")e.codice="chiusa";throw e}
    return BE.stato()}
};
const adesso=()=>Date.now()+skew;
function toast(m){const e=$("toast");e.textContent=m;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,3200)}
async function chiedi(url,body){
  const r=await fetch(url,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{cache:"no-store"});
  let j={};try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error(j.errore||"rete");e.codice=j.errore;e.dati=j;throw e}return j}
const persTxt=n=>n+" "+(+n===1?t("pers1"):t("persN"));
const giornoLungo=d=>{const o=dkey(adesso()),dm=dkey(adesso()+864e5);const g=new Date(d+"T12:00").toLocaleDateString(lang==="en"?"en-GB":"it-IT",{weekday:"long",day:"numeric",month:"long"});return d===o?t("oggi")+", "+g:d===dm?t("domani")+", "+g:g.charAt(0).toUpperCase()+g.slice(1)};
const hh=ms=>new Date(ms).toLocaleTimeString(lang==="en"?"en-GB":"it-IT",{hour:"2-digit",minute:"2-digit"});
function linkMio(){const u=new URL(location.href);u.search="";u.hash="";if(LID)u.searchParams.set("l",LID);u.searchParams.set("p",PID);if(PK)u.searchParams.set("k",PK);return u.href}
function mie(){try{return JSON.parse(store.get("tavolo-prenota-mie")||"[]")}catch(e){return[]}}
function salvaMia(x){const a=mie().filter(y=>y.id!==x.id);a.unshift(x);store.set("tavolo-prenota-mie",JSON.stringify(a.slice(0,8)))}

/* ---------- orari ---------- */
function slotsDi(d){const out=[];(INFO.orari||[]).forEach((f,i)=>{const[a,b]=f.split("-");let[h,m]=a.split(":").map(Number);const fine=b;const list=[];
  while(true){const s=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");if(s>=fine)break;const t0=new Date(d+"T"+s).getTime();if(t0>adesso()+30*60e3)list.push(s);m+=30;if(m>=60){m-=60;h++}if(h>23)break}
  if(list.length)out.push({nome:a<"17:00"?t("pranzo"):t("cena"),list})});return out}
function giorni(){const g=[];for(let i=0;i<30;i++){const d=dkey(adesso()+i*864e5);if((INFO.chiuso||[]).includes(new Date(d+"T12:00").getDay()))continue;if(!slotsDi(d).length)continue;g.push(d)}return g}

/* ---------- avvio ---------- */
async function avvio(){
  if(!LID&&/github\.io$/i.test(location.hostname)){if(qs.has("w")){location.replace("prenota-wa.html"+location.search);return}chiuso(t("codice"));return}
  try{const j=PID?await BE.stato():await BE.info();INFO=j.locale;P=j.pren||null;skew=INFO.ora-Date.now()}
  catch(e){chiuso(e.codice==="chiuso"?t("chiusoE"):e.codice==="codice"?t("codice"):t("rete"));return}
  document.documentElement.style.setProperty("--accent",INFO.accent||"#2F6B4F");
  disegna();
}
function chiuso(msg){$("bar").hidden=true;$("m").innerHTML=`<p class="chiuso">${esc(msg)}</p>`}
function testata(){document.documentElement.lang=lang;$("nome").textContent=INFO?INFO.nome:"Prenota";$("sub").textContent=t("sub")+(INFO&&INFO.citta?" · "+INFO.citta:"");document.title=(INFO?INFO.nome+" · ":"")+t("sub");
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang))}
function disegna(){testata();if(!INFO)return;if(P)vistaStato();else vistaForm()}

/* ---------- modulo ---------- */
function vistaForm(){
  const gg=giorni();if(!sel.g||!gg.includes(sel.g)){sel.g=gg[0]||null;sel.o=null}
  const fasce=sel.g?slotsDi(sel.g):[];if(sel.o&&!fasce.some(f=>f.list.includes(sel.o)))sel.o=null;
  const loc=lang==="en"?"en-GB":"it-IT",m=mie().filter(x=>x.data>=dkey(adesso()));
  const v=id=>$(id)?$(id).value:"";const bozza={n:v("fNome"),t:v("fTel"),no:v("fNote"),a:$("fAcc")?$("fAcc").checked:false,pv:$("fPriv")?$("fPriv").checked:false,sa:$("fSal")?$("fSal").checked:false};
  $("m").innerHTML=`${m.length?`<h2>${esc(t("mie"))}</h2><div class="mie">${m.map(x=>`<a href="?${LID?"l="+encodeURIComponent(LID)+"&":""}p=${encodeURIComponent(x.id)}${x.k?"&k="+encodeURIComponent(x.k):""}"><span>${esc(giornoLungo(x.data))}</span><b>${esc(x.ora)}</b></a>`).join("")}</div>`:""}
  <h2>${esc(t("giorno"))}</h2><div class="pills" role="group" aria-label="${esc(t("giorno"))}">${gg.map(d=>{const x=new Date(d+"T12:00");return`<button class="day" data-g="${d}" aria-pressed="${d===sel.g}"><small>${esc(x.toLocaleDateString(loc,{weekday:"short"}).replace(".",""))}</small><b>${x.getDate()}</b><small>${esc(x.toLocaleDateString(loc,{month:"short"}).replace(".",""))}</small></button>`}).join("")}</div>
  <h2>${esc(t("pers"))}</h2><div class="stepper"><button data-p="-1" aria-label="−" ${sel.p<=1?"disabled":""}>−</button><b>${sel.p}</b><button data-p="1" aria-label="+" ${sel.p>=INFO.max?"disabled":""}>+</button><span>${esc(+sel.p===1?t("pers1"):t("persN"))}</span></div>
  ${sel.p>=INFO.max?`<div class="note" style="margin-top:6px">${esc(t("ePers"))}${INFO.tel?" · "+esc(INFO.tel):""}</div>`:""}
  <h2>${esc(t("ora"))}</h2>${fasce.length?fasce.map(f=>`${fasce.length>1?`<div class="fascia">${esc(f.nome)}</div>`:""}<div class="slots">${f.list.map(o=>`<button class="slot" data-o="${o}" aria-pressed="${o===sel.o}">${o}</button>`).join("")}</div>`).join(""):`<p class="note">${esc(t("nessuno"))}</p>`}
  <h2>${esc(t("dati"))}</h2><div class="fields">
   <label for="fNome">${esc(t("nome"))}<input type="text" id="fNome" autocomplete="name" maxlength="50" value="${esc(bozza.n||store.get("tavolo-prenota-nome")||"")}"></label>
   <label for="fTel">${esc(t("tel"))}<input type="tel" id="fTel" autocomplete="tel" inputmode="tel" maxlength="20" placeholder="333 123 4567" value="${esc(bozza.t||store.get("tavolo-prenota-tel")||"")}"><span class="note" style="font-weight:400">${esc(t("telH"))}</span></label>
   <label for="fNote">${esc(t("note"))}<textarea id="fNote" maxlength="160" placeholder="${esc(t("noteP"))}">${esc(bozza.no)}</textarea></label>
   <label class="check"><input type="checkbox" id="fAcc" ${bozza.a?"checked":""}> ♿ ${esc(t("acc"))}</label>
   <label class="check"><input type="checkbox" id="fPriv" ${bozza.pv?"checked":""}> ${esc(t("priv"))}</label>
   <div class="note" style="margin:-4px 0 4px 30px"><a href="${esc(urlDoc("privacy"))}" target="_blank" rel="noopener">${esc(t("privL"))}</a> · <a href="${esc(urlDoc("cookie"))}" target="_blank" rel="noopener">${esc(t("cookieL"))}</a></div>
   <label class="check"><input type="checkbox" id="fSal" ${bozza.sa?"checked":""}> ${esc(t("sal"))}</label>
   ${err?`<div class="err" role="alert">${esc(err)}</div>`:""}</div>`;
  $("bar").hidden=false;$("riass").textContent=sel.g&&sel.o?`${giornoLungo(sel.g)} ${t("alle")} ${sel.o} · ${persTxt(sel.p)}`:t("scegli");
  const b=$("vai");b.className="big";b.textContent=inviando?t("invio"):t("prenota");b.disabled=!(sel.g&&sel.o)||inviando;
}
async function invia(){
  if(inviando)return;err="";const nome=$("fNome").value.trim(),tel=$("fTel").value.trim();
  if(nome.length<2)err=t("eNome");else if(tel.replace(/\D/g,"").length<8)err=t("eTel");else if(!$("fPriv").checked)err=t("ePriv");else if(($("fNote").value.trim()||$("fAcc").checked)&&!$("fSal").checked)err=t("eSal");
  if(err){vistaForm();return}
  inviando=true;vistaForm();
  try{const j=await BE.nuova({nome,tel,data:sel.g,ora:sel.o,persone:sel.p,note:$("fNote").value,acc:$("fAcc").checked,privacy:true,salute:$("fSal").checked});
    store.set("tavolo-prenota-nome",nome);store.set("tavolo-prenota-tel",tel);
    PID=j.id;PK=j.k;P=j.pren;salvaMia({id:j.id,k:j.k,data:sel.g,ora:sel.o});
    try{history.replaceState(null,"",linkMio())}catch(e){}
    inviando=false;window.scrollTo(0,0);disegna();
  }catch(e){inviando=false;err={nome:t("eNome"),tel:t("eTel"),persone:t("ePers"),orario:t("eOra"),privacy:t("ePriv"),salute:t("eSal"),doppia:t("eDoppia"),chiuso:t("chiusoE")}[e.codice]||t("rete");if(e.codice==="orario")sel.o=null;vistaForm()}
}

/* ---------- la tua prenotazione ---------- */
function calGoogle(){const d=P.data.replace(/-/g,""),o=P.ora.replace(":",""),f=new Date(P.inizio+2*3600e3),fine=dkey(f).replace(/-/g,"")+"T"+String(f.getHours()).padStart(2,"0")+String(f.getMinutes()).padStart(2,"0")+"00";
  const q=new URLSearchParams({action:"TEMPLATE",text:t("calTit",{n:INFO.nome}),dates:`${d}T${o}00/${fine}`,details:t("calDesc",{p:persTxt(P.persone),u:linkMio()}),location:INFO.nome+(INFO.citta?", "+INFO.citta:"")});
  return"https://calendar.google.com/calendar/render?"+q.toString()}
function ics(){const p2=n=>String(n).padStart(2,"0"),loc=d=>d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+"T"+p2(d.getHours())+p2(d.getMinutes())+"00",u=linkMio();
  const e=s=>String(s).replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  return["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Tavolo//Prenota//IT","BEGIN:VEVENT","UID:"+P.id+"@tavolo","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z","DTSTART:"+loc(new Date(P.inizio)),"DURATION:PT2H",
   "SUMMARY:"+e(t("calTit",{n:INFO.nome})),"DESCRIPTION:"+e(t("calDesc",{p:persTxt(P.persone),u})),"URL:"+u,"BEGIN:VALARM","TRIGGER:-PT1H","ACTION:DISPLAY","DESCRIPTION:"+e(t("notTit",{n:INFO.nome})),"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n")}
function vistaStato(){
  $("bar").hidden=true;const inF=(adesso()>=P.finestra||simula)&&P.stato!=="nuova",att=(P.stato==="attesa"||P.stato==="nuova")&&P.conf!=="disdetta";
  let ic="✓",cls="",tit=t("ricevuta"),sot=t("ricevutaP");
  if(P.stato==="rifiutata"){ic="!";cls="no";tit=t("rifiutata");sot=t("rif_"+(P.motivo||"x"))+(INFO.tel?" "+INFO.tel:"")}
  else if(P.conf==="disdetta"){ic="✕";cls="no";tit=t("disdetta");sot=t("disdettaP")}
  else if(P.stato==="nuova"){ic="…";cls="warn";tit=t("inviata");sot=t("inviataP")}
  else if(P.stato==="annullata"&&P.conf==="disdetta"){ic="✕";cls="no";tit=t("disdetta");sot=t("disdettaP")}
  else if(P.stato==="annullata"){ic="!";cls="no";tit=t("annullata");sot=t("annullataP")+(INFO.tel?" "+INFO.tel:"")}
  else if(P.stato==="arrivato"||P.stato==="chiusa"){tit=t("arrivato");sot=t("arrivatoP")}
  else if(P.conf==="confermata"){tit=t("confermata");sot=t("confermataP")}
  else if(inF&&INFO.promemoria){ic="?";cls="warn";tit=t("chiede");sot=t("chiedeP")}
  const chiede=att&&P.conf!=="confermata"&&inF&&INFO.promemoria;
  const nAp="Notification" in window;let nPerm="default";try{nPerm=nAp?Notification.permission:"denied"}catch(e){}
  $("m").innerHTML=`<div class="card">
   <div class="stato"><div class="ico ${cls}" aria-hidden="true">${ic}</div><div><h3>${esc(tit)}</h3><p>${esc(sot)}</p></div></div>
   <div><div class="quando">${esc(P.ora)}</div><div style="font-weight:600">${esc(giornoLungo(P.data))}</div></div>
   <dl class="det"><dt>${esc(t("chi"))}</dt><dd>${esc(P.nome)}</dd><dt>${esc(t("quanti"))}</dt><dd>${esc(persTxt(P.persone))}${P.acc?" · ♿ "+esc(t("tavAcc")):""}</dd>${P.note?`<dt>${esc(t("note").replace(/ \(.*\)/,""))}</dt><dd style="font-weight:400">${esc(P.note)}</dd>`:""}</dl>
   ${chiede?`<div class="ask"><div class="row2"><button class="big" id="si">${esc(t("si"))}</button><button class="big no" id="nodis">${esc(t("no"))}</button></div></div>`:""}
   ${att&&P.conf!=="confermata"&&!inF&&INFO.promemoria?`<div class="conf"><b style="font-size:15px">${esc(t("avvisa"))}</b><span class="note">${esc(t("dopo",{h:hh(P.finestra)}))}</span>
     <a class="ghost" href="${esc(calGoogle())}" target="_blank" rel="noopener">📅 ${esc(t("cal"))}</a>
     ${DEMO?"":`<button class="ghost" id="ics">📲 ${esc(t("calF"))}</button>`}
     ${PUSH_OK()&&(!IOS||APP)?(pushAttivo()?`<span class="note" style="color:var(--ok);font-weight:600">🔔 ${esc(t("pushOk",{h:hh(P.finestra)}))}</span>`:nPerm==="denied"?`<span class="note">${esc(t("pushNo"))}</span>`:`<button class="big" id="pushOn">🔔 ${esc(t("push"))}</button>`)
       :IOS&&!APP&&MODO==="fb"?`<span class="note">📲 ${esc(t("iosApp"))}</span>`
       :nAp&&nPerm!=="denied"?`<button class="ghost" id="notif">🔔 ${esc(t("notif"))}</button>`:""}
     <span class="note" id="notifTxt">${!PUSH_OK()&&nPerm==="granted"?esc(t("notifOk",{h:hh(P.finestra)})):""}</span></div>`:""}
   ${installa&&!APP?`<button class="ghost" id="inst">📲 ${esc(t("installa"))} · <span style="font-weight:400">${esc(t("installaP"))}</span></button>`:""}
   ${att?(chiediDisdici?`<div class="ask" style="background:var(--crit-soft)"><b style="color:var(--crit)">${esc(t("disdiciQ"))}</b><div class="row2"><button class="big no" id="disSi">${esc(t("disdiciSi"))}</button><button class="ghost" id="disNo">${esc(t("annulla"))}</button></div></div>`:chiede?"":`<button class="lnk" id="dis">${esc(t("disdici"))}</button>`):""}
  </div>
  ${att?`<p class="note" style="margin-top:14px">${esc(t("salva"))}</p><button class="ghost" id="copia">${esc(t("copia"))}</button>`:""}
  ${DEMO&&att&&P.conf!=="confermata"&&!inF&&INFO.promemoria?`<div class="demo" style="margin-top:14px">${esc(t("demoT"))}<br><button class="ghost" id="sim">${esc(t("demoB"))}</button></div>`:""}
  <button class="lnk" id="nuova" style="margin-top:12px">${esc(t("nuova"))}</button>`;
  programma();
}
function pushAttivo(){return store.get("tavolo-push-"+PID)==="1"&&(()=>{try{return Notification.permission==="granted"}catch(e){return false}})()}
function programma(){clearTimeout(notifTimer);if(!P||P.stato!=="attesa"||P.conf==="confermata")return;const d=P.finestra-adesso();
  if(d<=0){avvisaOra();return}if(d<2147e6)notifTimer=setTimeout(()=>{disegna();avvisaOra()},d+500)}
function avvisaOra(){if(notificato||!INFO.promemoria||!P||P.stato!=="attesa"||P.conf==="confermata")return;notificato=true;
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  try{if("Notification" in window&&Notification.permission==="granted"){const n=new Notification(t("notTit",{n:INFO.nome}),{body:t("notBody",{o:P.ora,p:persTxt(P.persone)}),tag:"tavolo-"+P.id});n.onclick=()=>{window.focus();n.close()}}}catch(e){}}
async function rispondi(r){try{const j=await BE.risposta(r);P=j.pren;chiediDisdici=false;disegna()}
  catch(e){if(e.dati&&e.dati.pren)P=e.dati.pren;toast(e.codice==="presto"?t("presto"):e.codice==="chiusa"?t("chiusaE"):t("rete"));chiediDisdici=false;disegna()}}
async function aggiorna(){if(!PID||document.hidden||chiediDisdici)return;try{const j=await BE.stato();const prima=JSON.stringify(P);P=j.pren;skew=j.locale.ora-Date.now();if(JSON.stringify(P)!==prima)disegna()}catch(e){}}

/* ---------- eventi ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("button,[data-g],[data-o],[data-p]");if(!b)return;
  if(b.dataset.l){lang=b.dataset.l;store.set("tavolo-prenota-lingua",lang);disegna();return}
  if(b.dataset.g){sel.g=b.dataset.g;sel.o=null;err="";vistaForm();return}
  if(b.dataset.o){sel.o=b.dataset.o;err="";vistaForm();return}
  if(b.dataset.p){sel.p=Math.max(1,Math.min(INFO.max,sel.p+ +b.dataset.p));vistaForm();return}
  switch(b.id){
    case"vai":invia();break;
    case"si":rispondi("conferma");break;
    case"nodis":case"disSi":rispondi("disdici");break;
    case"dis":chiediDisdici=true;disegna();break;
    case"disNo":chiediDisdici=false;disegna();break;
    case"sim":simula=true;disegna();avvisaOra();break;
    case"copia":{const u=linkMio();try{await navigator.clipboard.writeText(u);toast(t("copiato"))}catch(_){toast(u)}break}
    case"nuova":PID=PK=null;P=null;simula=false;notificato=false;try{history.replaceState(null,"",location.pathname+(LID?"?l="+encodeURIComponent(LID):""))}catch(_){}await avvio();window.scrollTo(0,0);break;
    case"ics":{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics()],{type:"text/calendar"}));a.download="prenotazione.ics";document.body.appendChild(a);a.click();a.remove();break}
    case"inst":{if(installa){installa.prompt();try{await installa.userChoice}catch(_){}installa=null;disegna()}break}
    case"pushOn":{b.disabled=true;let st="denied";try{st=await Notification.requestPermission()}catch(_){}
      if(st!=="granted"){disegna();break}
      try{const reg=await navigator.serviceWorker.register("prenota-sw.js");await navigator.serviceWorker.ready;
        let sub=await reg.pushManager.getSubscription();const chiave=Uint8Array.from(atob(INFO.vapid.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
        if(sub&&sub.options&&sub.options.applicationServerKey&&btoa(String.fromCharCode(...new Uint8Array(sub.options.applicationServerKey)))!==btoa(String.fromCharCode(...chiave))){await sub.unsubscribe();sub=null}
        if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:chiave});
        await BE.push(sub.toJSON());store.set("tavolo-push-"+PID,"1")}
      catch(_){toast(t("pushNo"))}
      disegna();break}
    case"notif":{let st="denied";try{st=await Notification.requestPermission()}catch(_){}
      const el=$("notifTxt");if(el)el.textContent=st==="granted"?t("notifOk",{h:hh(P.finestra)}):t("notifNo");if(st!=="granted"){b.hidden=true}programma();break}
  }
});
avvio();setInterval(aggiorna,15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)aggiorna()});
</script>
