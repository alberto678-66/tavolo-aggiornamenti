<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prenota un tavolo</title>
<meta name="robots" content="noindex">
<style>
:root{--accent:#2F6B4F;--bg:#F4F6F3;--fg:#18201B;--muted:#5B665E;--line:#D9DED8;--card:#FFFFFF;--crit:#A33A2B}
@media (prefers-color-scheme:dark){:root{--bg:#121613;--fg:#E9EEEA;--muted:#A3ADA6;--line:#2C342E;--card:#1A201C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px calc(32px + env(safe-area-inset-bottom,0px))}
main{max-width:440px;margin:0 auto;display:grid;gap:18px}
header{text-align:center;display:grid;gap:6px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:26px;margin:0 auto}
h1{font-size:26px;line-height:1.15;margin:4px 0 0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
input,select,textarea{font:inherit;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:46px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.due{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pers{display:flex;align-items:center;gap:10px}
.pers button{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:22px;cursor:pointer}
.pers output{min-width:48px;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.invia{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.nota{color:var(--muted);font-size:13.5px;text-align:center}
.err{color:var(--crit);font-size:14px;min-height:1em}
.chiuso{color:var(--crit);font-size:13.5px;font-weight:400}
.vuoto{text-align:center;color:var(--muted);padding:40px 0}
.spunta{display:flex;align-items:center;gap:10px;font-weight:500}
.spunta input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
</style>
</head>
<body>
<main id="app"><p class="vuoto">Caricamento…</p></main>
<script>
"use strict";
(function(){
  const q = new URLSearchParams(location.search);
  const nome = (q.get("n") || "").slice(0, 60), wa = (q.get("w") || "").replace(/\D/g, ""), max = Math.min(50, Math.max(1, parseInt(q.get("m"), 10) || 10));
  const chiusi = (q.get("c") || "").split(",").filter(x => /^[0-6]$/.test(x)).map(Number);
  const fasce = (q.get("o") || "12:30-14:30,19:30-23:00").split(",").map(f => f.trim().match(/^(\d{2}):(\d{2})-(\d{2}):(\d{2})$/)).filter(Boolean);
  const acc = (q.get("a") || "").replace(/[^0-9a-fA-F]/g, "");
  if (acc.length === 6) document.documentElement.style.setProperty("--accent", "#" + acc);
  const app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  if (!nome || wa.length < 8) { app.innerHTML = '<p class="vuoto">Link di prenotazione non valido. Chiedi al locale il link corretto.</p>'; return; }
  document.title = "Prenota da " + nome;
  const pad = n => String(n).padStart(2, "0");
  const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const oggi = new Date(); oggi.setHours(12, 0, 0, 0);
  const fine = new Date(oggi.getTime() + 60 * 864e5);
  const orari = []; fasce.forEach(m => { let t = +m[1] * 60 + +m[2]; const f = +m[3] * 60 + +m[4]; while (t <= f) { orari.push(pad(Math.floor(t / 60) % 24) + ":" + pad(t % 60)); t += 15; } });
  let persone = 2;
  app.innerHTML = `<header><div class="logo">${esc(nome.replace(/^(trattoria|ristorante|bar|pizzeria|osteria|caffè|pub)\s+(da\s+|di\s+)?/i, "").trim()[0] || "T").toUpperCase()}</div><h1>Prenota da ${esc(nome)}</h1><div class="sub">Scegli quando venire: la richiesta arriva al locale su WhatsApp</div></header>
  <form id="f" novalidate>
    <div class="due"><label>Giorno<input type="date" id="g" min="${iso(oggi)}" max="${iso(fine)}" value="${iso(oggi)}" required></label>
    <label>Ora<select id="o" required>${orari.map(o => `<option>${o}</option>`).join("")}</select></label></div>
    <div class="chiuso" id="ch"></div>
    <label>Persone<div class="pers"><button type="button" id="meno" aria-label="Meno persone">−</button><output id="np">2</output><button type="button" id="piu" aria-label="Più persone">+</button></div></label>
    <label>Nome<input type="text" id="nm" autocomplete="name" maxlength="50" required placeholder="Nome e cognome"></label>
    <label>Telefono<input type="tel" id="tel" autocomplete="tel" maxlength="20" placeholder="Per eventuali comunicazioni"></label>
    <label class="spunta"><input type="checkbox" id="acc"> Serve un tavolo accessibile (sedia a rotelle)</label>
    <label>Note<textarea id="nt" maxlength="160" placeholder="Allergie, seggiolone, un'occasione speciale…"></textarea></label>
    <div class="err" id="err" role="alert"></div>
    <button class="invia" type="submit">Invia la richiesta su WhatsApp</button>
    <p class="nota">La prenotazione è confermata quando il locale ti risponde. Nessun dato viene salvato su questa pagina.</p>
  </form>`;
  const $ = id => document.getElementById(id);
  const giorniNome = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];
  const controlla = () => { const d = new Date($("g").value + "T12:00"); const c = !isNaN(d) && chiusi.includes(d.getDay()); $("ch").textContent = c ? `Il ${giorniNome[d.getDay()]} il locale è chiuso: scegli un altro giorno.` : ""; return !c; };
  const aggiornaOrari = () => { const sel = $("o"), prima = sel.value, adesso = new Date(), oggiIso = iso(adesso), lim = pad(adesso.getHours() + (adesso.getMinutes() >= 30 ? 1 : 0)) + ":" + (adesso.getMinutes() >= 30 ? "00" : "30");
    const lista = $("g").value === oggiIso ? orari.filter(o => o >= lim) : orari;
    sel.innerHTML = lista.length ? lista.map(o => `<option${o === prima ? " selected" : ""}>${o}</option>`).join("") : '<option value="">Oggi non ci sono più orari</option>'; };
  $("g").addEventListener("change", () => { controlla(); aggiornaOrari(); }); controlla(); aggiornaOrari();
  const aggiorna = () => { $("np").textContent = persone; };
  $("meno").onclick = () => { persone = Math.max(1, persone - 1); aggiorna(); };
  $("piu").onclick = () => { persone = Math.min(max, persone + 1); aggiorna(); if (persone === max) $("err").textContent = `Per più di ${max} persone chiama il locale.`; };
  $("f").addEventListener("submit", e => {
    e.preventDefault(); $("err").textContent = "";
    const g = $("g").value, o = $("o").value, n = $("nm").value.trim();
    if (!g || g < iso(oggi) || g > iso(fine)) { $("err").textContent = "Scegli un giorno valido."; return; }
    if (!controlla()) { $("err").textContent = "Quel giorno il locale è chiuso."; return; }
    if (!o) { $("err").textContent = "Scegli un orario."; return; }
    if (n.length < 2) { $("err").textContent = "Scrivi il tuo nome."; $("nm").focus(); return; }
    const d = new Date(g + "T12:00"), bello = `${giorniNome[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
    const righe = [`Ciao! Vorrei prenotare un tavolo da ${nome}.`, ``, `Nome: ${n}`, `Giorno: ${bello} (${g})`, `Ora: ${o}`, `Persone: ${persone}`];
    if ($("tel").value.trim()) righe.push(`Telefono: ${$("tel").value.trim()}`);
    if ($("acc").checked) righe.push(`Accessibilità: tavolo accessibile per sedia a rotelle`);
    if ($("nt").value.trim()) righe.push(`Note: ${$("nt").value.trim().replace(/\s+/g, " ")}`);
    righe.push(``, `(richiesta dalla pagina Prenota)`);
    const testo = righe.join("\n");
    location.href = "https://wa.me/" + wa + "?text=" + encodeURIComponent(testo);
  });
})();
</script>
</body>
</html>
